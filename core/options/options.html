<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek Pilot · 设置</title><link rel="stylesheet" href="../ui.css"></head>
<body class="settings-page"><div class="settings-app"><main class="page settings-panel">
<header class="page-heading"><div><h1>设置</h1><p id="settingsAccountInfo">当前 DeepSeek 账号</p></div></header>
<div id="settingsNotice" role="status"></div>
<div id="automationAlert" class="automation-alert" role="alert" hidden><strong id="automationAlertTitle"></strong><p id="automationAlertDetail"></p><button id="viewIssues">查看未完成任务</button><button id="resumeRequests" hidden title="请先确认 DeepSeek 原生聊天已恢复正常。此操作只恢复插件任务，不调用登录接口。">已确认限制解除，恢复任务</button></div>
<section class="card settings-section"><header class="section-heading"><h2>上下文预算</h2><button type="button" class="help-trigger" aria-label="上下文预算详情" data-help="项目记忆开启时，按所选预算接续到同项目的新会话。默认推荐 256,000 token，最高可选 1,000,000。已用上下文、本轮输入和回答预留合计达到预算 × 提醒比例时切换，默认比例为 100%；降低比例可提前切换。没有 DeepSeek token 数据时按正文长度估算，不显示伪造的实际用量。">i</button></header>
<div class="setting-row"><label for="maxContextTokens">切换会话预算</label><select id="maxContextTokens"><option value="32000">32,000 token</option><option value="64000">64,000 token</option><option value="128000">128,000 token</option><option value="256000" selected>256,000 · 默认 / 推荐</option><option value="384000">384,000 token</option><option value="512000">512,000 token</option><option value="768000">768,000 token</option><option value="1000000">1,000,000 · 上限</option></select></div>
<div class="setting-row"><label for="warningRatio">接续提醒</label><select id="warningRatio"><option value="0.75">75% · 较早</option><option value="0.85">85% · 提前</option><option value="0.95">95% · 较晚</option><option value="1" selected>100% · 默认</option></select></div>
<div class="setting-row"><label for="replyReserveTokens">回答预留</label><select id="replyReserveTokens"><option value="2000">2,000 token</option><option value="4000" selected>4,000 · 默认</option><option value="8000">8,000 token</option></select></div></section>
<section class="card settings-section"><header class="section-heading"><h2>记忆更新</h2><button type="button" class="help-trigger" aria-label="记忆更新详情" data-help="每轮回答完成后更新记忆，包括最新普通会话；按会话创建时间顺序排队。仅整理尚未处理或内容变化的会话，不重放未变化的后续会话。个人与项目分别使用不同提示词，一次处理一个完整会话，支持追加、修改和删除。自动化会话除外，也可主动更新。">i</button></header>
<div class="setting-row"><label for="memoryModeDefault">默认带入项目记忆</label><input id="memoryModeDefault" class="switch" type="checkbox" aria-label="新会话默认带入项目记忆"></div>
<div class="setting-row"><div class="setting-label"><label for="memoryStartAtMs">起始时间</label><button type="button" class="help-trigger" aria-label="记忆起始时间详情" data-help="使用本机时区，默认是插件首次运行时间。只整理此时间及之后创建的普通会话，旧会话后来追加消息也不纳入。创建时间未知时暂不整理。修改时间立即生效并保留已有记忆；根据本地已保存的会话更新队列，不扫描远端历史。尚未保存的历史在用户打开会话时接收。">i</button></div><input id="memoryStartAtMs" type="datetime-local" step="1" required></div></section>
<section class="card settings-section"><header class="section-heading"><h2>聊天显示</h2><button type="button" class="help-trigger" aria-label="聊天显示详情" data-help="显示开关立即保存。个人和项目记忆开关控制附带记忆的显示；消息 token 开关控制每条消息下方的 token 与时间信息；自动化会话开关控制侧边栏整个自动化会话分组。显示设置不影响消息发送、记忆学习或自动化执行。">i</button></header>
<div class="setting-row"><label for="showPersonalMemory">显示个人记忆</label><input id="showPersonalMemory" class="switch" type="checkbox"></div>
<div class="setting-row"><label for="showProjectMemory">显示项目记忆</label><input id="showProjectMemory" class="switch" type="checkbox"></div>
<div class="setting-row"><label for="showMessageTokens">显示消息 token 与时间</label><input id="showMessageTokens" class="switch" type="checkbox"></div>
<div class="setting-row"><label for="showAutomationSessions">显示侧边栏自动化会话</label><input id="showAutomationSessions" class="switch" type="checkbox"></div></section>
<section class="card settings-section"><header class="section-heading"><h2>自动化队列</h2><button type="button" class="help-trigger" aria-label="自动化队列详情" data-help="归类、记忆整理、压缩和会话接续共用串行队列，一次只运行一个任务，切换账号也不会增加并发。任务失败后跳过，其他任务继续；未完成任务显示红色提醒，可主动重试或忽略。暂停同时停止新任务、后台补读和自动清理；当前任务完成收尾，正常聊天继续。登录失效或账号受限时停止主动请求；限流后全账号冷却 60 秒。归类和接续可调序，记忆按会话顺序执行；取消整理保留已有记忆，取消接续保留原草稿。">i</button></header>
<div class="section-toolbar"><p id="queueSummary" role="status"></p><div class="actions"><button id="refreshQueue">刷新</button><button id="pauseQueue">暂停队列</button></div></div>
<div id="automationQueue"></div><details class="history-details"><summary>最近完成或取消</summary><div id="queueHistory"></div></details></section>
<section class="card settings-section"><header class="section-heading"><h2>需要核对的任务</h2><button type="button" class="help-trigger" aria-label="核对任务详情" data-help="发送或自动化结果不明时，先核对 DeepSeek 历史，再决定重试或忽略。原始草稿会保留。">i</button></header><div id="jobs"></div></section>
<section class="card settings-section"><header class="section-heading"><h2>归档项目</h2></header><div id="archived"></div></section></main>
<div class="memory-app"><aside><header><h1>记忆</h1></header><p id="accountInfo" class="muted"></p><nav id="scopes" aria-label="记忆范围"></nav><p id="sourceInfo" class="hint"></p></aside>
<main><header class="memory-heading"><div><div class="title-line"><h2 id="scopeTitle">个人记忆</h2><button id="scopeDetails" class="help-trigger" type="button" aria-label="当前记忆详情" aria-describedby="scopeHint" data-help="正在读取记忆状态">i</button></div><p id="scopeSummary"></p></div>
<div class="actions memory-toolbar"><button id="refresh">刷新</button><button id="distill" hidden>更新记忆</button><details class="menu"><summary>更多</summary><div class="menu-items"><button id="import">导入记忆</button><button id="export">导出记忆</button><button id="manageSelection" class="danger">批量删除</button></div></details></div></header>
<div id="notice" role="status"></div><div class="memory-selection" hidden><label class="check"><input id="selectAll" type="checkbox"> 全选</label><span id="selectionCount" class="muted"></span><div class="actions"><button id="cancelSelection">完成</button><button id="deleteSelected" class="danger" disabled>删除所选（0）</button></div></div><div id="memories"></div></main></div></div>
<dialog id="memoryEditor" class="memory-editor" aria-labelledby="memoryEditorTitle"><form id="memoryForm"><header class="section-heading"><h2 id="memoryEditorTitle">编辑类别</h2><button type="button" class="help-trigger" aria-label="类别编辑详情" data-help="每个输入框对应一条记忆，支持多行内容。在末尾空白框补充内容即可增加条目；清空原有条目会在保存时删除。该类别一次保存，其他类别不受影响。">i</button></header><div id="categoryEntries" class="category-editor-items"></div><div id="editorNotice" role="status"></div><div class="actions editor-footer"><button type="button" id="cancelEdit">取消</button><button id="saveCategory" type="submit" class="primary">保存类别</button></div></form></dialog>
<input type="file" id="file" accept="application/json,.json" hidden><script src="../ui.js"></script><script src="options.js"></script><script src="../manage/manage.js"></script></body></html>
