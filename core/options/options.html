<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 项目工作台 · 设置</title><link rel="stylesheet" href="../ui.css"></head>
<body><main class="page narrow"><header><div><h1>项目工作台</h1><p id="accountInfo">设置只影响当前 DeepSeek 账号</p></div><a id="openManage" class="primary" href="../manage/manage.html">管理记忆 ↗</a></header>
<div id="notice" role="status"></div><section class="card"><h2>上下文预算</h2>
<label>最大上下文预算 <select id="maxContextTokens"><option value="32000">精简 · 32,000 token</option><option value="64000" selected>适中 · 64,000 token</option><option value="128000">宽裕 · 128,000 token</option><option value="256000">很宽裕 · 256,000 token</option></select></label>
<label>接续提醒比例 <select id="warningRatio"><option value="0.75">较早 · 75%</option><option value="0.85" selected>适中 · 85%</option><option value="0.95">较晚 · 95%</option></select></label>
<label>为下一次回答预留 <select id="replyReserveTokens"><option value="2000">精简 · 2,000 token</option><option value="4000" selected>适中 · 4,000 token</option><option value="8000">宽裕 · 8,000 token</option></select></label>
<p class="hint">没有 DSW token 数据时，会按正文长度估算接续时机；界面不会把估算写成 token 用量。</p></section>
<section class="card"><h2>项目记忆</h2>
<label class="check"><input id="memoryModeDefault" type="checkbox"> 新会话默认在发送时带入项目记忆</label>
<label>每完成多少轮更新记忆 <select id="distillEveryTurns"></select></label>
<p class="hint">已归项目的完整问答计入项目记忆；所有普通会话（含未归项目）计入个人记忆，自动化会话除外。达到轮数后自动发起整理会话，也可在管理页手动整理。“适中”默认每 5 轮。</p>
<button id="save" class="primary">保存设置</button></section>
<section class="card"><h2>归档项目</h2><div id="archived"></div></section>
<section class="card"><h2>需要核对的作业</h2><div id="jobs"></div></section></main><script src="options.js"></script></body></html>
