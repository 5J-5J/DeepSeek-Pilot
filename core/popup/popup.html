<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>DeepSeek 项目工作台 · 记忆文件夹</title>
  <style>
    body { width: 320px; margin: 0; padding: 14px; font: 13px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif; color: #1f2328; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    .status { padding: 8px 10px; border-radius: 8px; background: #f2f3f5; margin-bottom: 10px; word-break: break-all; }
    .status.is-ok { background: #eaf6ec; }
    .status.is-degraded { background: #fdf0e7; }
    .status.is-unauthorized { background: #f2f3f5; }
    .status strong { display: block; }
    .status small { color: #6b7280; }
    button { display: block; width: 100%; box-sizing: border-box; margin-top: 8px; padding: 7px 10px; border: 1px solid #c9ced6; border-radius: 8px; background: #fff; font: inherit; cursor: pointer; }
    button:hover { background: #f6f7f8; }
    #report { margin-top: 10px; color: #57606a; white-space: pre-wrap; display: none; }
  </style>
</head>
<body>
  <h1>记忆文件夹</h1>
  <div class="status" id="status">读取状态中…</div>
  <button type="button" id="authorize">选择或重新授权文件夹</button>
  <button type="button" id="reload">从文件夹重新载入记忆</button>
  <p id="report"></p>
  <script src="../logic/fs-core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
