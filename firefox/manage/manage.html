<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek Pilot · 记忆</title><link rel="stylesheet" href="../ui.css"></head>
<body class="manage-page"><div class="memory-app"><aside><header><h1>记忆</h1><a href="../options/options.html">设置</a></header><p id="accountInfo" class="muted"></p><nav id="scopes" aria-label="记忆范围"></nav><p id="sourceInfo" class="hint"></p></aside>
<main><header class="memory-heading"><div><div class="title-line"><h2 id="scopeTitle">个人记忆</h2><button id="scopeDetails" class="help-trigger" type="button" aria-label="当前记忆详情" aria-describedby="scopeHint" data-help="正在读取记忆状态">i</button></div><p id="scopeSummary"></p></div>
<div class="actions memory-toolbar"><button id="refresh">刷新</button><button id="distill" hidden>更新记忆</button><details class="menu"><summary>更多</summary><div class="menu-items"><button id="import">导入记忆</button><button id="export">导出记忆</button><button id="manageSelection" class="danger">批量删除</button></div></details></div></header>
<div id="notice" role="status"></div><div class="memory-selection" hidden><label class="check"><input id="selectAll" type="checkbox"> 全选</label><span id="selectionCount" class="muted"></span><div class="actions"><button id="cancelSelection">完成</button><button id="deleteSelected" class="danger" disabled>删除所选（0）</button></div></div><div id="memories"></div></main></div>
<dialog id="memoryEditor" class="memory-editor" aria-labelledby="memoryEditorTitle"><form id="memoryForm"><header class="section-heading"><h2 id="memoryEditorTitle">编辑类别</h2><button type="button" class="help-trigger" aria-label="类别编辑详情" data-help="每个输入框是一条记忆，可新增或修改；清空条目会在保存时删除。仅保存当前类别。">i</button></header><div id="categoryEntries" class="category-editor-items"></div><div id="editorNotice" role="status"></div><div class="actions editor-footer"><button type="button" id="cancelEdit">取消</button><button id="saveCategory" type="submit" class="primary">保存类别</button></div></form></dialog>
<input type="file" id="file" accept="application/json,.json" hidden><script src="../ui.js"></script><script src="manage.js"></script></body></html>
